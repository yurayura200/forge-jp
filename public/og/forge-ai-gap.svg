<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630"
     font-family="'Hiragino Sans', 'Yu Gothic Medium', 'Noto Sans JP', system-ui, sans-serif">
  <defs>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#181614" stop-opacity="1"/>
      <stop offset="100%" stop-color="#0E0D0B" stop-opacity="1"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="#0A0908"/>

  <!-- Top header -->
  <g transform="translate(60, 50)">
    <line x1="0" y1="-4" x2="34" y2="-4" stroke="#FF6B35" stroke-width="3"/>
    <text fill="#FF6B35" font-size="11" font-weight="800" letter-spacing="0.36em" y="14">AI 実装事例 — 6 PATTERNS</text>
    <text y="56" fill="#FFFFFF" font-size="34" font-weight="900" letter-spacing="-0.02em">あなたの業務、AI でここまで変わる。</text>
    <text y="92" fill="#888" font-size="13" font-weight="500" letter-spacing="0.02em">米国 88%、日本 42.7% — 差を埋める実装パターン</text>
  </g>

  <g transform="translate(1140, 50)">
    <text text-anchor="end" y="14" fill="#666" font-size="10" font-weight="700" letter-spacing="0.36em">FORGE</text>
    <text text-anchor="end" y="34" fill="#FFFFFF" font-size="13" font-weight="700" letter-spacing="0.04em">AI 実装ファーム</text>
  </g>

  <!-- 6 cards in 3x2 grid -->
  <!-- Row 1: y=130 -->
  <!-- Card 1: 問い合わせ対応 -->
  <g transform="translate(40, 130)">
    <rect width="370" height="170" fill="url(#cardGrad)" rx="3"/>
    <line x1="0" y1="0" x2="48" y2="0" stroke="#FF6B35" stroke-width="3"/>
    <text x="22" y="32" fill="#888" font-size="9" letter-spacing="0.34em" font-weight="800">01 — 顧客対応</text>
    <text x="22" y="64" fill="#FFFFFF" font-size="22" font-weight="900" letter-spacing="-0.01em">問い合わせ対応</text>
    <text x="22" y="100" fill="#555" font-size="10" letter-spacing="0.22em" font-weight="800">BEFORE</text>
    <text x="22" y="124" fill="#888" font-size="17" font-weight="700">人で 1 件 5 分</text>
    <text x="22" y="146" fill="#FF6B35" font-size="10" letter-spacing="0.22em" font-weight="800">AFTER</text>
    <text x="22" y="160" fill="#FFFFFF" font-size="14" font-weight="900">AI で 30 秒</text>
    <g transform="translate(285, 122)">
      <rect width="70" height="32" fill="#FF6B35" rx="2"/>
      <text x="35" y="21" text-anchor="middle" fill="#FFFFFF" font-size="13" font-weight="900">10 倍速</text>
    </g>
  </g>

  <!-- Card 2: 領収書振り分け -->
  <g transform="translate(415, 130)">
    <rect width="370" height="170" fill="url(#cardGrad)" rx="3"/>
    <line x1="0" y1="0" x2="48" y2="0" stroke="#FF6B35" stroke-width="3"/>
    <text x="22" y="32" fill="#888" font-size="9" letter-spacing="0.34em" font-weight="800">02 — 経理</text>
    <text x="22" y="64" fill="#FFFFFF" font-size="22" font-weight="900" letter-spacing="-0.01em">領収書振り分け</text>
    <text x="22" y="100" fill="#555" font-size="10" letter-spacing="0.22em" font-weight="800">BEFORE</text>
    <text x="22" y="124" fill="#888" font-size="17" font-weight="700">月 20 時間</text>
    <text x="22" y="146" fill="#FF6B35" font-size="10" letter-spacing="0.22em" font-weight="800">AFTER</text>
    <text x="22" y="160" fill="#FFFFFF" font-size="14" font-weight="900">月 1 時間</text>
    <g transform="translate(285, 122)">
      <rect width="70" height="32" fill="#FF6B35" rx="2"/>
      <text x="35" y="21" text-anchor="middle" fill="#FFFFFF" font-size="13" font-weight="900">95% 削減</text>
    </g>
  </g>

  <!-- Card 3: 議事録作成 -->
  <g transform="translate(790, 130)">
    <rect width="370" height="170" fill="url(#cardGrad)" rx="3"/>
    <line x1="0" y1="0" x2="48" y2="0" stroke="#FF6B35" stroke-width="3"/>
    <text x="22" y="32" fill="#888" font-size="9" letter-spacing="0.34em" font-weight="800">03 — 営業</text>
    <text x="22" y="64" fill="#FFFFFF" font-size="22" font-weight="900" letter-spacing="-0.01em">議事録作成</text>
    <text x="22" y="100" fill="#555" font-size="10" letter-spacing="0.22em" font-weight="800">BEFORE</text>
    <text x="22" y="124" fill="#888" font-size="17" font-weight="700">会議後 60 分</text>
    <text x="22" y="146" fill="#FF6B35" font-size="10" letter-spacing="0.22em" font-weight="800">AFTER</text>
    <text x="22" y="160" fill="#FFFFFF" font-size="14" font-weight="900">即時要約</text>
    <g transform="translate(285, 122)">
      <rect width="70" height="32" fill="#FF6B35" rx="2"/>
      <text x="35" y="21" text-anchor="middle" fill="#FFFFFF" font-size="11" font-weight="900">リアルタイム</text>
    </g>
  </g>

  <!-- Row 2: y=320 -->
  <!-- Card 4: 提案書作成 -->
  <g transform="translate(40, 320)">
    <rect width="370" height="170" fill="url(#cardGrad)" rx="3"/>
    <line x1="0" y1="0" x2="48" y2="0" stroke="#FF6B35" stroke-width="3"/>
    <text x="22" y="32" fill="#888" font-size="9" letter-spacing="0.34em" font-weight="800">04 — 営業</text>
    <text x="22" y="64" fill="#FFFFFF" font-size="22" font-weight="900" letter-spacing="-0.01em">提案書作成</text>
    <text x="22" y="100" fill="#555" font-size="10" letter-spacing="0.22em" font-weight="800">BEFORE</text>
    <text x="22" y="124" fill="#888" font-size="17" font-weight="700">1 件 4 時間</text>
    <text x="22" y="146" fill="#FF6B35" font-size="10" letter-spacing="0.22em" font-weight="800">AFTER</text>
    <text x="22" y="160" fill="#FFFFFF" font-size="14" font-weight="900">1 件 30 分</text>
    <g transform="translate(285, 122)">
      <rect width="70" height="32" fill="#FF6B35" rx="2"/>
      <text x="35" y="21" text-anchor="middle" fill="#FFFFFF" font-size="13" font-weight="900">8 倍速</text>
    </g>
  </g>

  <!-- Card 5: 24h 窓口 -->
  <g transform="translate(415, 320)">
    <rect width="370" height="170" fill="url(#cardGrad)" rx="3"/>
    <line x1="0" y1="0" x2="48" y2="0" stroke="#FF6B35" stroke-width="3"/>
    <text x="22" y="32" fill="#888" font-size="9" letter-spacing="0.34em" font-weight="800">05 — 人件費</text>
    <text x="22" y="64" fill="#FFFFFF" font-size="22" font-weight="900" letter-spacing="-0.01em">24h 顧客窓口</text>
    <text x="22" y="100" fill="#555" font-size="10" letter-spacing="0.22em" font-weight="800">BEFORE</text>
    <text x="22" y="124" fill="#888" font-size="17" font-weight="700">月 ¥40 万（1 人）</text>
    <text x="22" y="146" fill="#FF6B35" font-size="10" letter-spacing="0.22em" font-weight="800">AFTER</text>
    <text x="22" y="160" fill="#FFFFFF" font-size="14" font-weight="900">月 ¥3 万（AI）</text>
    <g transform="translate(265, 122)">
      <rect width="90" height="32" fill="#FF6B35" rx="2"/>
      <text x="45" y="21" text-anchor="middle" fill="#FFFFFF" font-size="11" font-weight="900">¥37 万削減</text>
    </g>
  </g>

  <!-- Card 6: 履歴書スクリーニング -->
  <g transform="translate(790, 320)">
    <rect width="370" height="170" fill="url(#cardGrad)" rx="3"/>
    <line x1="0" y1="0" x2="48" y2="0" stroke="#FF6B35" stroke-width="3"/>
    <text x="22" y="32" fill="#888" font-size="9" letter-spacing="0.34em" font-weight="800">06 — 採用</text>
    <text x="22" y="64" fill="#FFFFFF" font-size="22" font-weight="900" letter-spacing="-0.01em">履歴書スクリーニング</text>
    <text x="22" y="100" fill="#555" font-size="10" letter-spacing="0.22em" font-weight="800">BEFORE</text>
    <text x="22" y="124" fill="#888" font-size="17" font-weight="700">1 件 5 分</text>
    <text x="22" y="146" fill="#FF6B35" font-size="10" letter-spacing="0.22em" font-weight="800">AFTER</text>
    <text x="22" y="160" fill="#FFFFFF" font-size="14" font-weight="900">1 件 10 秒</text>
    <g transform="translate(285, 122)">
      <rect width="70" height="32" fill="#FF6B35" rx="2"/>
      <text x="35" y="21" text-anchor="middle" fill="#FFFFFF" font-size="13" font-weight="900">30 倍速</text>
    </g>
  </g>

  <!-- Bottom CTA bar -->
  <g transform="translate(0, 510)">
    <rect width="1200" height="120" fill="#FF6B35"/>
    <g transform="translate(60, 38)">
      <text fill="#FFFFFF" font-size="11" font-weight="700" letter-spacing="0.32em">FORGE — AI 実装ファーム</text>
      <text y="36" fill="#FFFFFF" font-size="22" font-weight="800" letter-spacing="-0.005em">AI の構築・評価・運用までを一貫して支援する実装パートナー。</text>
    </g>
    <g transform="translate(1140, 50)">
      <text text-anchor="end" fill="#FFFFFF" font-size="13" font-weight="700" letter-spacing="0.18em" opacity="0.85">VISIT</text>
      <text text-anchor="end" y="32" fill="#FFFFFF" font-size="20" font-weight="900" letter-spacing="0.02em">forge.komugi-ai.jp</text>
    </g>
  </g>
</svg>
