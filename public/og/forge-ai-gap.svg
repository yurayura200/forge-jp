<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630"
     font-family="'Hiragino Sans', 'Yu Gothic Medium', 'Noto Sans JP', system-ui, sans-serif">
  <defs>
    <radialGradient id="bg" cx="50%" cy="20%" r="80%">
      <stop offset="0%" stop-color="#1A1410"/>
      <stop offset="60%" stop-color="#0E0A07"/>
      <stop offset="100%" stop-color="#050402"/>
    </radialGradient>
    <linearGradient id="ember" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF8C42"/>
      <stop offset="50%" stop-color="#FF6B35"/>
      <stop offset="100%" stop-color="#E8541F"/>
    </linearGradient>
    <linearGradient id="dim" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3A2A20" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#1A1410" stop-opacity="0.0"/>
    </linearGradient>
    <linearGradient id="goldLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#D4A77A" stop-opacity="0"/>
      <stop offset="50%" stop-color="#D4A77A" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#D4A77A" stop-opacity="0"/>
    </linearGradient>
    <filter id="usGlow" x="-20%" y="-50%" width="140%" height="200%">
      <feGaussianBlur stdDeviation="14" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="grid" width="50" height="50" patternUnits="userSpaceOnUse">
      <path d="M 50 0 L 0 0 0 50" fill="none" stroke="#FF6B35" stroke-width="0.4" stroke-opacity="0.06"/>
    </pattern>
  </defs>

  <!-- Background layers -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#grid)"/>
  <rect width="1200" height="280" fill="url(#dim)"/>

  <!-- Top brand bar -->
  <line x1="60" y1="58" x2="1140" y2="58" stroke="url(#goldLine)" stroke-width="0.8"/>
  <g transform="translate(60,40)">
    <rect x="0" y="-2" width="3" height="22" fill="#FF6B35"/>
    <text x="14" y="16" fill="#FFFFFF" font-size="16" font-weight="800" letter-spacing="0.18em">FORGE</text>
    <line x1="86" y1="-3" x2="86" y2="20" stroke="#3A2A20" stroke-width="1"/>
    <text x="98" y="16" fill="#9A8C7F" font-size="13" font-weight="500" letter-spacing="0.05em">AI 実装ファーム</text>
  </g>
  <text x="1140" y="56" text-anchor="end" fill="#6B5D52" font-size="11" letter-spacing="0.12em" font-weight="500">FORGE.KOMUGI-AI.JP</text>

  <!-- Eyebrow + Headline -->
  <g transform="translate(60,108)">
    <text x="0" y="0" fill="#FF6B35" font-size="11" font-weight="700" letter-spacing="0.32em">DATA REPORT — 2025</text>
    <text x="0" y="44" fill="#FFFFFF" font-size="42" font-weight="800" letter-spacing="-0.015em">日本の AI 導入は、米国の半分以下。</text>
    <text x="0" y="78" fill="#C8B9A8" font-size="17" font-weight="500" letter-spacing="0.005em">対応できる実装会社が、圧倒的に足りていない。</text>
  </g>

  <!-- Big duel: US vs JP -->
  <g transform="translate(60,236)">
    <!-- US block -->
    <g>
      <text x="0" y="0" fill="#9A8C7F" font-size="12" font-weight="700" letter-spacing="0.22em">UNITED STATES</text>
      <text x="0" y="92" fill="#FFFFFF" font-size="116" font-weight="900" letter-spacing="-0.04em" filter="url(#usGlow)">88<tspan fill="#FF6B35" font-size="76">%</tspan></text>
      <text x="0" y="124" fill="#6B5D52" font-size="12" font-weight="500" letter-spacing="0.04em">AI を業務で活用する企業の割合</text>
      <text x="0" y="142" fill="#5A4D44" font-size="10" letter-spacing="0.04em">McKinsey State of AI 2025（n=1,993／105 か国）</text>
    </g>

    <!-- divider VS -->
    <g transform="translate(420,46)">
      <line x1="0" y1="-30" x2="0" y2="92" stroke="#3A2A20" stroke-width="1"/>
      <circle cx="0" cy="32" r="22" fill="#0A0805" stroke="#FF6B35" stroke-width="1.2"/>
      <text x="0" y="38" text-anchor="middle" fill="#FF6B35" font-size="13" font-weight="800" letter-spacing="0.1em">VS</text>
    </g>

    <!-- JP block -->
    <g transform="translate(460,0)">
      <text x="0" y="0" fill="#9A8C7F" font-size="12" font-weight="700" letter-spacing="0.22em">JAPAN</text>
      <text x="0" y="92" fill="#888" font-size="116" font-weight="900" letter-spacing="-0.04em">42.7<tspan fill="#5A4D44" font-size="76">%</tspan></text>
      <text x="0" y="124" fill="#6B5D52" font-size="12" font-weight="500" letter-spacing="0.04em">生成 AI 活用方針が定まっている企業</text>
      <text x="0" y="142" fill="#5A4D44" font-size="10" letter-spacing="0.04em">総務省 情報通信白書 令和7年版</text>
    </g>

    <!-- Gap arrow / multiplier -->
    <g transform="translate(900,46)">
      <text x="0" y="-4" fill="#9A8C7F" font-size="11" font-weight="700" letter-spacing="0.2em">THE GAP</text>
      <text x="0" y="64" fill="#FF6B35" font-size="62" font-weight="900" letter-spacing="-0.03em">2.1<tspan font-size="32">×</tspan></text>
      <text x="0" y="92" fill="#9A8C7F" font-size="11" letter-spacing="0.04em">米国は日本の 2 倍以上</text>
      <text x="0" y="110" fill="#5A4D44" font-size="10" letter-spacing="0.04em">コア業務導入は 3 倍超 (6.1% / 1.9%)</text>
    </g>
  </g>

  <!-- Sub stats grid -->
  <g transform="translate(60,452)">
    <line x1="0" y1="0" x2="1080" y2="0" stroke="#2A1F18" stroke-width="0.8"/>
    <g transform="translate(0,28)">
      <text x="0" y="0" fill="#6B5D52" font-size="10" font-weight="700" letter-spacing="0.2em">DX KPI 設定率</text>
      <text x="0" y="32" fill="#FFFFFF" font-size="26" font-weight="800">米 89.8% <tspan fill="#888" font-weight="700">vs 日 27.4%</tspan></text>
      <text x="0" y="50" fill="#5A4D44" font-size="10" letter-spacing="0.03em">IPA DX 動向 2025（3.3 倍差）</text>
    </g>
    <g transform="translate(370,28)">
      <text x="0" y="0" fill="#6B5D52" font-size="10" font-weight="700" letter-spacing="0.2em">AI コア業務導入</text>
      <text x="0" y="32" fill="#FFFFFF" font-size="26" font-weight="800">米 6.1% <tspan fill="#888" font-weight="700">vs 日 1.9%</tspan></text>
      <text x="0" y="50" fill="#5A4D44" font-size="10" letter-spacing="0.03em">Stanford HAI AI Index 2025（3.2 倍差）</text>
    </g>
    <g transform="translate(740,28)">
      <text x="0" y="0" fill="#6B5D52" font-size="10" font-weight="700" letter-spacing="0.2em">日本 SME 生成 AI 使用率</text>
      <text x="0" y="32" fill="#FFFFFF" font-size="26" font-weight="800">23.5% <tspan fill="#FF6B35" font-size="14" font-weight="700">調査国 最下位</tspan></text>
      <text x="0" y="50" fill="#5A4D44" font-size="10" letter-spacing="0.03em">OECD AI Adoption SME 2025</text>
    </g>
  </g>

  <!-- Footer -->
  <line x1="60" y1="572" x2="1140" y2="572" stroke="url(#goldLine)" stroke-width="0.6"/>
  <g transform="translate(60,592)">
    <rect x="0" y="-2" width="3" height="22" fill="#FF6B35"/>
    <text x="14" y="16" fill="#FFFFFF" font-size="14" font-weight="700">Forge は、この需給ギャップを埋める AI 実装ファームです。</text>
  </g>
  <text x="1140" y="608" text-anchor="end" fill="#6B5D52" font-size="11" letter-spacing="0.18em" font-weight="600">構築 → 評価 → 運用</text>
</svg>
